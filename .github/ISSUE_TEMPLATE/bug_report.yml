name: Bug report / Ошибка
description: Report a reproducible problem without attaching personal desktop files.
body:
  - type: input
    id: version
    attributes:
      label: App and Windows versions
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and observed behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Monitors, scaling, OneDrive and other desktop utilities
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: checkboxes
    id: privacy
    attributes:
      label: Attachments
      options:
        - label: I checked attachments and removed personal files and paths.
